name: CI
on: [push, pull_request]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s pipelinedds/tests -v
      - run: python -m unittest -v
        working-directory: python-oop-api/stepapiopp
